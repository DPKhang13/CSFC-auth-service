# ==============================================================
# 1. Cấu hình Server
# ==============================================================
server:
  port: 8083
  servlet:
    context-path: /api/v1
  error:
    include-message: always

# ==============================================================
# 2. Cấu hình Spring
# ==============================================================
spring:
  application:
    name: engagement-service

  # --- Database (MySQL) ---
  datasource:
    url: jdbc:mysql://localhost:3306/engagement_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: 123456         # Mật khẩu của bạn
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --- JPA / Hibernate (SỬA LẠI: Thẳng hàng với datasource) ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        # Hibernate 6+ tự nhận diện, nhưng khai báo rõ cũng tốt
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        naming:
          physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  # --- Jackson (JSON Format - Thẳng hàng với datasource) ---
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh
    # Nếu bị lỗi "write-dates-as-timestamps", hãy bỏ comment dòng dưới:
    # serialization:
    #   write-dates-as-timestamps: false

  # --- Feign Client (Thẳng hàng với datasource) ---
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: FULL

# ==============================================================
# 3. Biến môi trường tự định nghĩa (Custom Config)
# ==============================================================
# Lưu ý: Phần này nằm NGOÀI 'spring', ngang hàng với 'server'
application:
  config:
    user-service-url: http://localhost:8081
    order-service-url: http://localhost:8082
    franchise-service-url: http://localhost:8080

# ==============================================================
# 4. Cấu hình Logging
# ==============================================================
logging:
  level:
    root: INFO
    com.yourcompany.engagement: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

# ==============================================================
# 5. Cấu hình Swagger/OpenAPI
# ==============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false
